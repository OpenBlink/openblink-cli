name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Check - gate the release on fmt + clippy + tests before building artifacts
  # ---------------------------------------------------------------------------
  check:
    name: Check (fmt + clippy + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install BLE build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked

  # ---------------------------------------------------------------------------
  # Build - native per-target release binaries packaged per OS (Linux: tar.gz,
  # macOS/Windows: zip). Each target re-verifies the mruby bytecode golden in
  # release mode to catch toolchains that miscompile mruby.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install BLE build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      # Guard against build environments that miscompile mruby into emitting
      # invalid bytecode without raising an error: compile a fixed Ruby program
      # and assert the bytecode matches a committed, known-good golden file.
      - name: Verify mrbc bytecode (golden)
        run: cargo test --locked --release --target ${{ matrix.target }} --test bytecode_golden

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="openblink-cli-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/openblink" "$staging/"
          cp README.md LICENSE "$staging/"
          cp -r licenses "$staging/licenses"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "openblink-cli-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/openblink.exe" $staging
          Copy-Item README.md, LICENSE $staging
          Copy-Item -Recurse licenses "$staging/licenses"
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify archive
        shell: bash
        run: |
          size=$(wc -c < "$ASSET")
          if [ "$size" -lt 1024 ]; then
            echo "::error::$ASSET is suspiciously small (${size} bytes)"
            exit 1
          fi
          echo "verified $ASSET (${size} bytes)"
          {
            echo "## Build (${{ matrix.target }})"
            echo "- \`$ASSET\` (${size} bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: openblink-cli-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish - aggregate artifacts, generate checksums, and create the GitHub
  # Release. Least-privilege: contents:write is granted only to this job.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum openblink-cli-* > checksums-sha256.txt
          cat checksums-sha256.txt
      - name: List release files
        run: ls -la dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/openblink-cli-*.tar.gz
            dist/openblink-cli-*.zip
            dist/checksums-sha256.txt
      - name: Release summary
        if: always()
        run: |
          {
            echo "## Release ${{ github.ref_name }}"
            echo ""
            echo "### SHA-256 Checksums"
            echo '```'
            cat dist/checksums-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
