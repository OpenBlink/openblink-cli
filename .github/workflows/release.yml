name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Check - gate the release on fmt + clippy + tests before building artifacts
  # ---------------------------------------------------------------------------
  check:
    name: Check (fmt + clippy + test)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Verify release tag and production policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/validate_release.sh
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - name: Verify the release tag matches Cargo
        run: |
          version=$(cargo metadata --format-version 1 --no-deps --locked | jq -er '.packages[] | select(.name == "openblink-cli") | .version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The release tag must match the Cargo package version (v$version)"
            exit 1
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: true
      - name: Install BLE build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked

  # ---------------------------------------------------------------------------
  # Build - native per-target release binaries packaged per OS (Linux: tar.gz,
  # macOS/Windows: zip). Each target re-verifies the mruby bytecode golden in
  # release mode to catch toolchains that miscompile mruby.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Release artifacts are built on the oldest supported OS images so
          # the binaries keep running there (glibc / macOS floor).
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, msvc_arch: amd64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, msvc_arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: true
      # mruby's Rake build invokes the MSVC compiler (cl.exe) directly, which is
      # not on PATH by default on the Windows runners. Load the Visual C++
      # developer environment so the native toolchain matches the Rust target.
      - name: Set up MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@b01428496a7be6ea8716337c299ffccc9fadc0c8 # v4.1.1
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Install BLE build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      # Guard against build environments that miscompile mruby into emitting
      # invalid bytecode without raising an error: compile a fixed Ruby program
      # and assert the bytecode matches a committed, known-good golden file.
      - name: Verify mrbc bytecode (golden)
        run: cargo test --locked --release --target ${{ matrix.target }} --test bytecode_golden

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="openblink-cli-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/openblink" "$staging/"
          cp README.md LICENSE "$staging/"
          cp -r licenses "$staging/licenses"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "openblink-cli-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/openblink.exe" $staging
          Copy-Item README.md, LICENSE $staging
          Copy-Item -Recurse licenses "$staging/licenses"
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify archive
        shell: bash
        run: |
          size=$(wc -c < "$ASSET")
          if [ "$size" -lt 1024 ]; then
            echo "::error::$ASSET is suspiciously small (${size} bytes)"
            exit 1
          fi
          echo "verified $ASSET (${size} bytes)"
          {
            echo "## Build (${{ matrix.target }})"
            echo "- \`$ASSET\` (${size} bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openblink-cli-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish - aggregate artifacts, generate checksums, and create the GitHub
  # Release. Least-privilege: contents:write is granted only to this job.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: production
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum openblink-cli-* > checksums-sha256.txt
          cat checksums-sha256.txt
      - name: List release files
        run: ls -la dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish a new GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash .github/scripts/validate_release.sh --publish-check
          assets=(dist/openblink-cli-*.tar.gz dist/openblink-cli-*.zip dist/checksums-sha256.txt)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${assets[@]}"
      - name: Release summary
        if: always()
        env:
          RELEASE_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "## Release ${RELEASE_NAME}"
            echo ""
            echo "### SHA-256 Checksums"
            echo '```'
            cat dist/checksums-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
