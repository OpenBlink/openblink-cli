[package]
name = "openblink-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Command-line Build & Blink tool for OpenBlink devices over BLE"
license = "BSD-3-Clause"
repository = "https://github.com/OpenBlink/openblink-cli"
readme = "README.md"
keywords = ["openblink", "mruby", "ble", "embedded", "cli"]
categories = ["command-line-utilities", "embedded"]

[[bin]]
name = "openblink"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "sync",
    "io-std",
    "io-util",
] }
btleplug = "0.11"
uuid = "1"
futures = "0.3"
crc = "3.4"
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
cc = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
